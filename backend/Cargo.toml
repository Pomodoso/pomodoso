[package]
name = "pomodoso-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pomodoso-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = "9"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.48", features = ["anyhow", "tracing", "tower", "tower-axum-matched-path", "logs"] }

anyhow = "1"
thiserror = "2"

dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Apple signs App Store notifications and StoreKit transactions with a
# certificate chain carried in the JWS header. Verifying that chain against
# Apple's pinned root is what lets us trust a purchase without a middleman.
base64 = "0.22"
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
axum-test = "20"
# Mints a throwaway CA chain so the JWS verifier can be tested against
# payloads we sign ourselves — including the ones it must reject.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
