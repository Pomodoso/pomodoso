schema_version: 1
id: productivity-pixels
name: "Year in Pixels: Productivity"
version: 1.1.0
icon: grid
description: Color every day by how productive it was, and see your year at a glance.
author: Pomodoso
license: MIT

collections:
  - key: day_state
    kind: daily
    fields:
      - key: state
        type: select
        user_editable: true
        options:
          - { value: very_productive, label: Very productive, color: "#2D6A8A" }
          - { value: productive, label: Productive, color: "#6FA3C4" }
          - { value: normal, label: Normal, color: "#C9D6DF" }
          - { value: unproductive, label: Not productive, color: "#D98C7A" }
          - { value: day_off, label: Day off, color: "#E6E2D8" }
      - { key: note, type: text, optional: true }

computed:
  logged_this_year: { count: day_state, range: this_year }
  productive_this_month: { count: day_state, where: { state: { in: [very_productive, productive] } }, range: this_month }
  productive_streak: { streak: day_state, where: { state: { in: [very_productive, productive] } }, at_least: 1 }

views:
  - id: main
    blocks:
      - { type: day-picker, collection: day_state, field: state }
      - { type: year-grid, collection: day_state, color_by: state, legend: true }
      - { type: breakdown, collection: day_state, field: state, range: this_year }
      - type: stat-row
        items:
          - { label: Productive this month, value: $productive_this_month, format: days }
          - { label: In a row, value: $productive_streak, format: days }
          - { label: Logged this year, value: $logged_this_year }

today:
  default_on: true
  widget: { type: select-today, label: How productive was today?, collection: day_state, field: state, after: year-grid }

hooks:
  - on: day_end
    ask: How productive was yesterday?
    pick: { collection: day_state, field: state }
  - on: weekly_report
    line: "Productive days this month: {$productive_this_month}"
