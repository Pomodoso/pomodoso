schema_version: 1
id: bookshelf
name: Bookshelf
version: 1.2.0
icon: book
description: Books you want to read, are reading and have read.
author: Pomodoso
license: MIT

collections:
  - key: book
    kind: item
    title_field: title
    fields:
      - { key: title, type: text }
      - { key: author, type: text, optional: true }
      - { key: status, type: select, options: [want, reading, read], default: want }
      - { key: pages, type: number, label: Pages, optional: true, min: 1 }
      - { key: current_page, type: number, label: On page, optional: true, min: 0 }
      - { key: rating, type: rating, optional: true }
      - { key: tags, type: tags, optional: true }
      - { key: cover, type: image_url, optional: true }
      - { key: link, type: url, optional: true }
      - { key: finished_on, type: date, optional: true }

computed:
  reading: { count: book, where: { status: reading } }
  read_this_month: { count: book, where: { status: read }, range: this_month, by: finished_on }
  read_this_year: { count: book, where: { status: read }, range: this_year, by: finished_on }
  # Pages of the books finished this year, and per day so far this year.
  pages_this_year: { sum: book, field: pages, where: { status: read }, range: this_year, by: finished_on }
  days_this_year: { calendar: year, show: passed }
  pages_per_day: { ratio: [$pages_this_year, $days_this_year] }
  pages_in_progress: { sum: book, field: current_page, where: { status: reading } }

views:
  - id: main
    blocks:
      - type: add-button
        label: Add the book on this page
        adds: book
        prefill: { title: $tab.title, link: $tab.url, cover: $tab.image }
      - { type: add-button, label: Add a book, adds: book }
      - { type: tag-filter, collection: book, field: tags }
      - type: board
        collection: book
        group_by: status
        card: { title: title, subtitle: author, image: cover, badge: rating }
  - id: stats
    label: Stats
    blocks:
      - type: stat-row
        items:
          - { label: Read this month, value: $read_this_month }
          - { label: Read this year, value: $read_this_year }
      - type: stat-row
        items:
          - { label: Pages read this year, value: $pages_this_year }
          - { label: Pages a day, value: $pages_per_day }
          - { label: In current books, value: $pages_in_progress }
      - type: text
        text: Add each book's pages to count them. Open a book you're reading to note the page you're on.
      - type: chart
        label: Books per month
        kind: bar
        series: { count: book, where: { status: read }, by: finished_on, group: month, range: 12mo }

today:
  default_on: true
  widget:
    type: record
    label: Reading
    collection: book
    where: { status: reading }
    title: title
    field: current_page
    max: pages
    caption: "{$read_this_month} read this month · {$read_this_year} this year"

rules:
  - collection: book
    when: { status: read }
    set: { finished_on: $today_date }
    only_if_empty: true
